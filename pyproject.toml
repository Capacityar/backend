[project]
name = "capacity-ar-api"
version = "0.1.0"
description = "MVP backend API for the Capacity AR learning platform."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.1",
    "psycopg[binary]==3.2.13",
    "pydantic-settings==2.7.1",
    "email-validator==2.2.0",
    "google-generativeai==0.8.6",
    "groq==0.31.0",
    "pypdf==6.11.0",
    "python-docx==1.2.0",
    "python-multipart==0.0.29",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
    "pytest-cov==6.0.0",
    "ruff==0.9.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
# Reglas por defecto de ruff (E4/E7/E9 + pyflakes); el código actual ya pasa.
# No se activa el orden de imports (I) para no reformatear el repo entero ahora.
